# Configuration gitleaks — détection de secrets avant qu'ils n'atteignent le dépôt.
# Le dispositif ne manipule aucune donnée personnelle sensible (§3.2), mais il
# touche à une base de données et à un serveur MLflow : identifiants, jetons et
# chaînes de connexion sont les fuites à prévenir.

title = "churn-saas"

[extend]
useDefault = true

[[rules]]
id = "chaine-connexion-postgres"
description = "Chaîne de connexion PostgreSQL avec mot de passe"
# RE2 (Go) n'accepte pas les assertions arrière : les identifiants de la
# maquette locale sont exclus par l'allowlist plus bas, pas par le motif.
regex = '''postgres(?:ql)?:\/\/[^:\s]+:[^@\s]+@[^\s'"]+'''
tags = ["base-de-donnees", "identifiants"]

[allowlist]
description = "Faux positifs connus"
paths = [
    '''\.venv/''',
    '''mlruns/''',
    '''artefacts/mlflow\.db''',
    '''\.ipynb_checkpoints/''',
]
regexes = [
    # Identifiants de la maquette locale : volontairement publics, jamais
    # utilisés hors de docker-compose (§11.4).
    '''churn:churn@entrepot''',
    '''POSTGRES_PASSWORD: churn''',
    '''GF_SECURITY_ADMIN_PASSWORD: churn''',
    '''password: churn''',
]
