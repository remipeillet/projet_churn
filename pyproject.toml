[project]
name = "churn-saas"
version = "1.0.0"
description = "Détection et priorisation du risque de résiliation client (churn SaaS B2B)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
churn = "churn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["churn"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Les notebooks ne sont pas formatés : leur mise en page sert la lecture
# (alignement des tableaux, commentaires de section) et le diff.
extend-exclude = ["*.ipynb"]
exclude = [".venv", "mlruns", "artefacts", "data", "figures"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — ordre des imports
    "UP",   # pyupgrade — tournures obsolètes
    "B",    # bugbear — pièges courants
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PTH",  # pathlib plutôt que os.path
    "RUF",  # règles propres à ruff
]
ignore = [
    "E501",    # longueur de ligne : déléguée au formateur
    "RUF001",  # caractères Unicode ambigus : les libellés sont en français
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Les tests peuvent employer des assertions nues et des noms longs.
"tests/*" = ["B011", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["churn"]
