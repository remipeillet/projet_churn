name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    name: Qualité et secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks analyse l'historique, pas seulement le dernier état

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les outils de qualité
        run: pip install ruff==0.16.8

      - name: Analyse statique (ruff)
        run: ruff check churn tests

      - name: Formatage (ruff format)
        run: ruff format --check --diff churn tests

      # Le dispositif touche à une base et à un serveur MLflow : identifiants et
      # chaînes de connexion sont les fuites à prévenir (§11.4).
      - name: Recherche de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests et scoring de fumée
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1

      - name: Suite de tests
        run: python -m pytest tests -q

      # Le scoring de fumée vérifie la chaîne complète sur données brutes :
      # contrat d'entrée, préparation, deux modèles, priorisation, sortie.
      - name: Scoring de fumée sur l'échantillon
        run: |
          python -m churn verifier --lot churn_saas_echantillon.csv
          python -m churn score --lot churn_saas_echantillon.csv --sortie /tmp/scores.csv
          python - <<'PY'
          import pandas as pd
          scores = pd.read_csv("/tmp/scores.csv")
          assert len(scores) == 50, "le lot doit être scoré intégralement"
          alertes = scores[scores.alerte]
          assert len(alertes) == 10, f"capacité non respectée : {len(alertes)}"
          assert (alertes.probabilite_churn >= scores.plancher_risque.iloc[0]).all()
          assert alertes.risque_de_perte_eur.is_monotonic_decreasing
          print("scoring de fumée : conforme")
          PY

      - name: Archiver les scores produits
        uses: actions/upload-artifact@v4
        with:
          name: scores-de-fumee
          path: /tmp/scores.csv

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de scoring
        run: docker build -t churn-saas:${{ github.sha }} .
      - name: Vérifier que l'image score un lot
        run: |
          docker run --rm -v "$PWD:/data" churn-saas:${{ github.sha }} \
            score --lot /data/churn_saas_echantillon.csv
